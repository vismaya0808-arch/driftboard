<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driftboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--paper:#e9eef1;--lane:#d8e2e8;--card:#fbfcfc;--ink:#14232e;--mute:#5d7280;--line:#c3d1d9;
--blue:#1f5f8b;--buoy:#f0b400;--storm:#c8382f;--calm:#3d9b78;--choppy:#f0b400}
@media (prefers-color-scheme:dark){:root{--paper:#0f1b24;--lane:#16283450;--card:#1b2f3c;--ink:#e6eef3;--mute:#8aa2b2;--line:#2a4252;--blue:#5aa9dc}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.hidden{display:none!important}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:8px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--storm);border:1.5px solid var(--storm)}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
label{display:block;font-weight:600;margin:12px 0 4px}
.err{color:var(--storm);min-height:1.4em;margin-top:8px}

/* auth */
#auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
#auth .hero{background:var(--ink);color:var(--paper);padding:8vw 6vw;display:flex;flex-direction:column;justify-content:flex-end}
#auth .hero h1{font-size:clamp(3rem,8vw,6.5rem);line-height:.9;margin:0;font-weight:800;letter-spacing:-.04em}
#auth .hero p{max-width:30ch;font-size:1.15rem;opacity:.8}
#auth form{padding:8vw 6vw;align-self:center;max-width:460px}
@media(max-width:780px){#auth{grid-template-columns:1fr}#auth .hero{padding:12vw 6vw 8vw}}

/* app shell */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1.5px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
aside h2{margin:0 6px 10px;font-size:1.4rem;font-weight:800;letter-spacing:-.03em}
.proj{text-align:left;background:none;border:0;padding:8px 10px;border-radius:10px;font-weight:600;color:var(--mute)}
.proj.on{background:var(--lane);color:var(--ink)}
.me{margin-top:auto;color:var(--mute);font-size:.9rem;padding:6px}
main{padding:20px 28px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:2rem;letter-spacing:-.03em;flex:1}
.crew{display:flex}
.crew span{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-left:-6px;border:2px solid var(--paper)}
.crew span.live{background:var(--calm)}
.bell{position:relative;border:1.5px solid var(--line);background:var(--card);border-radius:50%;width:38px;height:38px}
.bell b{position:absolute;top:-4px;right:-4px;background:var(--storm);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 6px}
#notes{position:absolute;right:28px;top:68px;width:320px;max-height:60vh;overflow:auto;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px;z-index:20;box-shadow:0 12px 30px #0003}
#notes div{padding:8px 10px;border-radius:8px}
#notes .new{background:var(--lane);font-weight:600}

/* board: lanes are water channels, cards are buoys */
.board{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:16px;align-items:start;overflow-x:auto}
.lane{background:var(--lane);border-radius:18px;padding:12px;min-height:300px}
.lane.over{outline:2.5px dashed var(--blue)}
.lane h3{margin:2px 6px 10px;display:flex;justify-content:space-between;font-size:1.05rem}
.lane h3 small{color:var(--mute);font-weight:400}
.card{background:var(--card);border-radius:14px;padding:12px 12px 10px 18px;margin-bottom:10px;cursor:grab;position:relative;border:1.5px solid var(--line)}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;border-radius:0 5px 5px 0;background:var(--calm)}
.card.choppy::before{background:var(--choppy)}.card.storm::before{background:var(--storm)}
.card.dragging{opacity:.4}
.card h4{margin:0 0 6px;font-size:1rem}
.meta{display:flex;gap:10px;color:var(--mute);font-size:.85rem;align-items:center}
.add{display:flex;gap:6px;margin-top:6px}
.add input{padding:8px 10px}

/* modal */
#modal{position:fixed;inset:0;background:#0a141b99;display:grid;place-items:center;padding:16px;z-index:30}
.sheet{background:var(--paper);border-radius:20px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmt{padding:8px 0;border-top:1px solid var(--line)}
.cmt b{font-weight:700}.cmt small{color:var(--mute);margin-left:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:40}
@media(max-width:700px){#app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1.5px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center}.me{margin:0 0 0 auto}main{padding:16px}}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .12s}.card:hover{transform:translateY(-2px)}}
</style>
</head>
<body>

<section id="auth">
  <div class="hero">
    <h1>Drift<br>board</h1>
    <p>Plan work with your crew. Cards move across the water, everyone sees it as it happens.</p>
  </div>
  <form id="authForm">
    <h2 id="authTitle" style="font-size:1.8rem;margin:0">Sign in</h2>
    <div id="nameWrap" class="hidden"><label for="aName">Your name</label><input id="aName" autocomplete="name"></div>
    <label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" required>
    <label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password" required>
    <div class="err" id="authErr" role="alert"></div>
    <button class="btn" id="authGo">Sign in</button>
    <button type="button" class="btn ghost" id="authSwap">Create an account</button>
  </form>
</section>

<div id="app" class="hidden">
  <aside>
    <h2>Driftboard</h2>
    <div id="projList"></div>
    <button class="btn ghost" id="newProj">New project</button>
    <div class="me"><span id="meName"></span> · <a href="#" id="logout" style="color:inherit">Sign out</a></div>
  </aside>
  <main>
    <div id="empty"><h1>Start your first project</h1><p>Create a project on the left, then invite teammates by email.</p></div>
    <div id="boardWrap" class="hidden">
      <div class="top">
        <h1 id="pTitle"></h1>
        <div class="crew" id="crew" aria-label="Project members"></div>
        <button class="btn ghost" id="invite">Add member</button>
        <button class="bell" id="bell" aria-label="Notifications">🔔<b id="badge" class="hidden">0</b></button>
      </div>
      <div id="notes" class="hidden"></div>
      <div class="board" id="board"></div>
    </div>
  </main>
</div>

<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="hidden" role="status"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LANES = [['adrift','Adrift','Not started'],['underway','Underway','In progress'],['docked','Docked','Done']];
const PRI = {calm:'Calm',choppy:'Choppy',storm:'Storm'};
let token = localStorage.token, me = JSON.parse(localStorage.me || 'null');
let pid = null, data = null, socket = null, notes = [], online = [], openTask = null, registering = false;

async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, { method,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { logout(); }
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(t.h); t.h = setTimeout(() => t.classList.add('hidden'), 3200); }
const initials = (n) => n.split(' ').map((w) => w[0]).slice(0, 2).join('').toUpperCase();

// ----- auth -----
$('#authSwap').onclick = () => {
  registering = !registering;
  $('#nameWrap').classList.toggle('hidden', !registering);
  $('#authTitle').textContent = $('#authGo').textContent = registering ? 'Create account' : 'Sign in';
  $('#authSwap').textContent = registering ? 'I already have an account' : 'Create an account';
};
$('#authForm').onsubmit = async (e) => {
  e.preventDefault(); $('#authErr').textContent = '';
  try {
    const d = await api(registering ? '/register' : '/login', 'POST',
      { name: $('#aName').value, email: $('#aEmail').value, password: $('#aPass').value });
    token = d.token; me = d.user; localStorage.token = token; localStorage.me = JSON.stringify(me);
    start();
  } catch (err) { $('#authErr').textContent = err.message; }
};
function logout() { localStorage.clear(); location.reload(); }
$('#logout').onclick = (e) => { e.preventDefault(); logout(); };

// ----- boot -----
async function start() {
  $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#meName').textContent = me.name;
  socket = io({ auth: { token } });
  socket.on('board:changed', async (p) => {
    if (p.projectId !== pid) return;
    await loadBoard();
    if (openTask) { const t = data.tasks.find((x) => x.id === openTask); t ? renderModal(t) : closeModal(); }
  });
  socket.on('presence', (names) => { online = names; renderCrew(); });
  socket.on('notify', (n) => { notes.unshift(n); renderNotes(); toast(n.text); });
  notes = await api('/notifications'); renderNotes();
  await loadProjects();
}
async function loadProjects(select) {
  const list = await api('/projects');
  $('#projList').innerHTML = list.map((p) => `<button class="proj ${p.id === (select || pid) ? 'on' : ''}" data-id="${p.id}">${esc(p.name)}</button>`).join('');
  $('#projList').querySelectorAll('.proj').forEach((b) => b.onclick = () => openProject(+b.dataset.id));
  if (!pid && list.length) openProject(list[0].id);
}
async function openProject(id) {
  if (pid) socket.emit('leave', pid);
  pid = id; socket.emit('join', id);
  $('#empty').classList.add('hidden'); $('#boardWrap').classList.remove('hidden');
  document.querySelectorAll('.proj').forEach((b) => b.classList.toggle('on', +b.dataset.id === id));
  await loadBoard();
}
async function loadBoard() { data = await api('/projects/' + pid); $('#pTitle').textContent = data.project.name; renderCrew(); renderBoard(); }

$('#newProj').onclick = async () => {
  const name = prompt('Project name'); if (!name) return;
  try { const p = await api('/projects', 'POST', { name }); await loadProjects(p.id); openProject(p.id); } catch (e) { toast(e.message); }
};
$('#invite').onclick = async () => {
  const email = prompt('Email of a registered teammate'); if (!email) return;
  try { await api(`/projects/${pid}/members`, 'POST', { email }); toast('Member added'); } catch (e) { toast(e.message); }
};

// ----- render -----
function renderCrew() {
  if (!data) return;
  $('#crew').innerHTML = data.members.map((m) =>
    `<span class="${online.includes(m.name) ? 'live' : ''}" title="${esc(m.name)}${online.includes(m.name) ? ' (online)' : ''}">${esc(initials(m.name))}</span>`).join('');
}
function renderBoard() {
  $('#board').innerHTML = LANES.map(([key, name, sub]) => {
    const tasks = data.tasks.filter((t) => t.status === key);
    return `<div class="lane" data-lane="${key}">
      <h3>${name} <small>${sub} · ${tasks.length}</small></h3>
      ${tasks.map((t) => `<div class="card ${t.priority}" draggable="true" data-id="${t.id}" tabindex="0">
        <h4>${esc(t.title)}</h4>
        <div class="meta"><span>${PRI[t.priority]}</span>${t.assignee_name ? `<span>${esc(t.assignee_name)}</span>` : '<span>Unassigned</span>'}${t.comment_count ? `<span>💬 ${t.comment_count}</span>` : ''}</div></div>`).join('')}
      <form class="add" data-lane="${key}"><input placeholder="Add a card" aria-label="New card in ${name}" required><button class="btn">Add</button></form>
    </div>`;
  }).join('');
  document.querySelectorAll('.card').forEach((c) => {
    const open = () => { openTask = +c.dataset.id; renderModal(data.tasks.find((t) => t.id === openTask)); };
    c.onclick = open; c.onkeydown = (e) => e.key === 'Enter' && open();
    c.ondragstart = (e) => { e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('dragging'); };
    c.ondragend = () => c.classList.remove('dragging');
  });
  document.querySelectorAll('.lane').forEach((l) => {
    l.ondragover = (e) => { e.preventDefault(); l.classList.add('over'); };
    l.ondragleave = () => l.classList.remove('over');
    l.ondrop = async (e) => {
      e.preventDefault(); l.classList.remove('over');
      try { await api('/tasks/' + e.dataTransfer.getData('text/plain'), 'PATCH', { status: l.dataset.lane }); } catch (er) { toast(er.message); }
    };
  });
  document.querySelectorAll('.add').forEach((f) => f.onsubmit = async (e) => {
    e.preventDefault(); const input = f.querySelector('input');
    try {
      const t = await api(`/projects/${pid}/tasks`, 'POST', { title: input.value });
      if (f.dataset.lane !== 'adrift') await api('/tasks/' + t.id, 'PATCH', { status: f.dataset.lane });
    } catch (er) { toast(er.message); }
  });
}

async function renderModal(t) {
  const comments = await api(`/tasks/${t.id}/comments`);
  const keep = document.activeElement && document.activeElement.id === 'cBody' ? $('#cBody').value : '';
  $('#sheet').innerHTML = `
    <input id="mTitle" value="${esc(t.title)}" style="font-size:1.3rem;font-weight:800" aria-label="Title">
    <label for="mDesc">Description</label><textarea id="mDesc" rows="3">${esc(t.description)}</textarea>
    <div class="row">
      <div><label for="mWho">Assigned to</label><select id="mWho"><option value="">Unassigned</option>
        ${data.members.map((m) => `<option value="${m.id}" ${m.id === t.assignee_id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></div>
      <div><label for="mPri">Conditions</label><select id="mPri">
        ${Object.entries(PRI).map(([k, v]) => `<option value="${k}" ${k === t.priority ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    </div>
    <div style="display:flex;gap:8px;margin:14px 0"><button class="btn" id="mSave">Save card</button>
      <button class="btn ghost" id="mClose">Close</button><button class="btn danger" id="mDel" style="margin-left:auto">Delete</button></div>
    <h3 style="margin:16px 0 4px">Comments</h3>
    <div>${comments.length ? comments.map((c) => `<div class="cmt"><b>${esc(c.name)}</b><small>${esc(c.created_at)}</small><div>${esc(c.body)}</div></div>`).join('') : '<p style="color:var(--mute)">No comments yet. Start the conversation below.</p>'}</div>
    <form id="cForm" class="add"><input id="cBody" placeholder="Write a comment" aria-label="Comment" required><button class="btn">Post</button></form>`;
  $('#modal').classList.remove('hidden');
  if (keep) { $('#cBody').value = keep; $('#cBody').focus(); }
  $('#mClose').onclick = closeModal;
  $('#mSave').onclick = async () => {
    try { await api('/tasks/' + t.id, 'PATCH', { title: $('#mTitle').value, description: $('#mDesc').value,
      assignee_id: $('#mWho').value ? +$('#mWho').value : null, priority: $('#mPri').value }); toast('Card saved'); closeModal(); } catch (e) { toast(e.message); }
  };
  $('#mDel').onclick = async () => { if (confirm('Delete this card?')) { await api('/tasks/' + t.id, 'DELETE'); closeModal(); } };
  $('#cForm').onsubmit = async (e) => { e.preventDefault(); try { await api(`/tasks/${t.id}/comments`, 'POST', { body: $('#cBody').value }); } catch (er) { toast(er.message); } };
}
function closeModal() { openTask = null; $('#modal').classList.add('hidden'); }
$('#modal').onclick = (e) => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', (e) => e.key === 'Escape' && closeModal());

// ----- notifications -----
function renderNotes() {
  const unread = notes.filter((n) => !n.read).length;
  $('#badge').textContent = unread; $('#badge').classList.toggle('hidden', !unread);
  $('#notes').innerHTML = notes.length ? notes.map((n) => `<div class="${n.read ? '' : 'new'}">${esc(n.text)}</div>`).join('') : '<div>Nothing yet. Assignments and comments show up here.</div>';
}
$('#bell').onclick = async () => {
  $('#notes').classList.toggle('hidden');
  if (!$('#notes').classList.contains('hidden') && notes.some((n) => !n.read)) {
    await api('/notifications/read', 'POST'); setTimeout(() => { notes.forEach((n) => n.read = 1); renderNotes(); }, 1500);
  }
};

if (token && me) start();
</script>
</body>
</html>
